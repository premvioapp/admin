<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin Panel</title>
<link rel="icon" href="img/icon-64.png">
<link rel="apple-touch-icon" href="img/icon-192.png">
<link rel="stylesheet" href="style.css">
<style>
  .layout{display:flex;min-height:calc(100vh - 56px)}
  .side{width:220px;flex:none;padding:16px 12px;border-right:1px solid var(--line);background:#fff}
  .side button{display:block;width:100%;text-align:left;border:0;background:none;padding:11px 14px;border-radius:10px;font-weight:600;margin-bottom:4px}
  .side button:hover{background:#f6efe8}
  .side button.on{background:var(--brand-soft);color:var(--brand)}
  .content{flex:1;padding:24px;max-width:1100px;min-width:0}
  .content h2{font-size:22px;margin-bottom:4px}
  .head{display:flex;align-items:center;gap:12px;margin-bottom:18px;flex-wrap:wrap}
  .head .spacer{flex:1}
  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:22px}
  .stat{padding:16px}
  .stat .v{font-size:26px;font-weight:800;margin-top:4px}
  table{width:100%;border-collapse:collapse;background:#fff}
  th,td{text-align:left;padding:11px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
  th{font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);background:#fcf9f6}
  .tablewrap{overflow-x:auto;border-radius:var(--radius);border:1px solid var(--line);box-shadow:var(--shadow)}
  td .btn+.btn{margin-left:6px}
  .thumb{width:40px;height:40px;border-radius:8px;object-fit:cover;background:#f1e9e1;vertical-align:middle}
  .switch{position:relative;display:inline-block;width:42px;height:24px}
  .switch input{display:none}
  .switch span{position:absolute;inset:0;background:#ddd;border-radius:99px;transition:.2s;cursor:pointer}
  .switch span::after{content:"";position:absolute;width:18px;height:18px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.2s}
  .switch input:checked+span{background:var(--green)}
  .switch input:checked+span::after{transform:translateX(18px)}
  .qrgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px}
  .qrcard{padding:16px;text-align:center}
  .qrcard img{width:100%;max-width:200px;display:block;margin:6px auto;image-rendering:pixelated}
  .qrcard .t{font-size:20px;font-weight:800}
  .qrcard .u{font-size:11px;color:var(--muted);word-break:break-all}
  .panel{padding:20px;margin-bottom:16px;max-width:560px}
  .panel h3{font-size:17px;margin-bottom:14px}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .catrow td{background:#fcf6f0;font-weight:700;color:var(--brand)}
  .photo-pick{display:flex;gap:14px;align-items:center}
  .photo-box{width:96px;height:96px;border-radius:12px;background:#f1e9e1;flex:none;overflow:hidden;display:grid;place-items:center;font-size:34px;border:1px solid var(--line)}
  .photo-box img{width:100%;height:100%;object-fit:cover}
  .photo-btns{display:flex;flex-direction:column;gap:6px;align-items:flex-start}
  .photo-btns label.btn{cursor:pointer}
  .salesgrid{display:grid;grid-template-columns:3fr 2fr;gap:20px;align-items:start}
  @media (max-width:900px){.salesgrid{grid-template-columns:1fr}}
  .barrow{display:flex;align-items:center;gap:10px}
  .bar{height:12px;border-radius:6px;background:var(--brand);min-width:2px;opacity:.85;flex:none}
  .side .count{display:inline-block;min-width:20px;padding:0 6px;margin-left:8px;border-radius:99px;background:var(--brand);color:#fff;font-size:12px;text-align:center;line-height:20px}
  .otabs{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}
  .otabs button{border:1px solid var(--line);background:#fff;border-radius:99px;padding:8px 16px;font-weight:600}
  .otabs button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
  .otabs .count{display:inline-block;min-width:22px;padding:0 6px;margin-left:6px;border-radius:99px;background:var(--brand);color:#fff;font-size:12px;text-align:center}
  .ogrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:14px}
  .ocard{padding:16px;display:flex;flex-direction:column;gap:10px;border-left:5px solid var(--line)}
  .ocard.new{border-left-color:var(--brand)} .ocard.processing,.ocard.ready{border-left-color:var(--amber)} .ocard.delivered{border-left-color:var(--green)} .ocard.cancelled{opacity:.6}
  .ohead{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
  .oname{font-size:18px}
  .otype{font-weight:600}
  .ocontact{display:flex;gap:8px;flex-wrap:wrap}
  .ocontact a{text-decoration:none}
  .ocard ul{margin:0;padding:0;list-style:none}
  .ocard li{display:flex;justify-content:space-between;padding:4px 0;border-bottom:1px dashed var(--line)}
  .ocard .note{background:var(--amber-soft);border-radius:8px;padding:8px 10px;font-size:14px}
  .ototal{display:flex;justify-content:space-between;font-weight:800}
  .opay{display:flex;flex-wrap:wrap;align-items:center;gap:8px;background:#f6f1ec;border-radius:10px;padding:9px 12px;font-size:14px}
  .opay.ok{background:var(--green-soft)} .opay.warn2{background:var(--amber-soft)}
  .oacts{display:flex;gap:8px;flex-wrap:wrap}
  .oacts .btn:first-child{flex:1}
  .tog{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:10px 0;border-bottom:1px solid var(--line);margin:0;color:var(--ink);font-size:15px}
  .tog small{display:block;font-weight:400}
  .tog b{font-weight:600}
  .content .empty{text-align:center;color:var(--muted);padding:50px 20px;grid-column:1/-1}
  .warn{background:var(--amber-soft);border:1px solid #f1d9a6;border-radius:12px;padding:12px 16px;margin-bottom:18px;font-size:14px}
  .linkbtn{background:none;border:0;color:var(--brand);font-weight:600;padding:0;margin-top:14px;display:block;text-align:center;width:100%}
  @media (max-width:760px){
    .layout{flex-direction:column}
    .side{width:auto;display:flex;overflow-x:auto;border-right:0;border-bottom:1px solid var(--line);padding:8px}
    .side button{width:auto;white-space:nowrap;margin:0 4px 0 0}
    .content{padding:16px}
  }
  @media print{
    .topbar,.side,.head,.noprint{display:none!important}
    body{background:#fff}
    .content{padding:0;max-width:none}
    .qrgrid{grid-template-columns:repeat(3,1fr);gap:10mm}
    .qrcard{break-inside:avoid;box-shadow:none;border:1.5px dashed #999}
  }
</style>
</head>
<body>
<div id="app"></div>
<script src="config.js"></script>
<script>window.CK_SITE = 'admin';</script>
<script src="firebase-app-compat.js"></script>
<script src="firebase-auth-compat.js"></script>
<script src="firebase-database-compat.js"></script>
<script src="qrcode.js"></script>
<script src="common.js"></script>
<script>
let view = 'dashboard', settings = {}, me = null, ordersSub = null;
const VIEWS = [['dashboard', 'Dashboard', 'chart'], ['online', 'Online orders', 'bag'], ['sales', 'Sales report', 'wallet'], ['menu', 'Menu & prices', 'book'], ['staff', 'Waiter accounts', 'users'], ['tables', 'Tables & QR codes', 'qr'], ['shop', 'Online shop', 'store'], ['settings', 'Settings', 'settings']];

(async () => {
  if (!CONFIGURED) return showSetupNeeded($('#app'));
  try {
    settings = await loadSettings();
    const staff = await currentStaff(['admin']);
    if (staff) return start(staff);
    const done = (await db.ref('meta/setupDone').once('value')).val();
    if (!done) return firstTimeSetup();
    renderLogin($('#app'), { title: settings.cafeName + ' · Admin', roles: ['admin'], onSuccess: start });
  } catch (e) {
    $('#app').innerHTML = `<div class="login-wrap"><div class="card login"><h1>Couldn't connect</h1><p class="muted">${esc(friendly(e))}</p>
      <p class="small muted">Check config.js (especially databaseURL) and that you published database.rules.json in Firebase → Realtime Database → Rules.</p></div></div>`;
  }
})();

// Sample data for a brand-new cafe (only added if menu/tables are empty)
async function seedIfEmpty() {
  const [m, t, s] = await Promise.all([db.ref('menu').once('value'), db.ref('tables').once('value'), db.ref('settings').once('value')]);
  const up = {};
  if (!s.exists()) up.settings = { ...DEFAULT_SETTINGS };
  if (!t.exists()) for (let i = 1; i <= 10; i++) up['tables/' + i] = { sort: i };
  if (!m.exists()) [
    ['Momo', 'Chicken Steam Momo', 180, '10 pcs with tomato achar'], ['Momo', 'Veg Steam Momo', 150, '10 pcs with tomato achar'],
    ['Momo', 'Buff Jhol Momo', 200, 'Served in spicy sesame soup'], ['Snacks', 'French Fries', 160, 'Crispy salted fries'],
    ['Snacks', 'Chicken Chowmein', 220, 'Stir-fried noodles'], ['Drinks', 'Milk Tea', 50, ''], ['Drinks', 'Black Coffee', 90, ''],
    ['Drinks', 'Cold Coffee', 180, 'With ice cream'], ['Drinks', 'Fresh Lime Soda', 120, ''],
  ].forEach(([category, name, price, description]) => {
    up['menu/' + db.ref('menu').push().key] = { category, name, price, description, image: '', available: true, createdAt: TS() };
  });
  if (Object.keys(up).length) await db.ref().update(up);
}

// First time only: create the owner's admin account
function firstTimeSetup() {
  $('#app').innerHTML = `
  <div class="login-wrap"><form class="card login" autocomplete="off">
    <div class="logo">${ic('userPlus', 34)}</div>
    <h1>Welcome! Create your admin account</h1>
    <p class="muted">This is shown only once. The first account made here becomes the owner/admin.</p>
    <div class="field"><label>Your name</label><input type="text" name="name" required maxlength="60" placeholder="e.g. Kushal"></div>
    <div class="field"><label>Admin username</label><input type="text" name="username" required autocapitalize="none" placeholder="letters/numbers, e.g. kushal"></div>
    <div class="field"><label>Password (min 6 characters)</label><input type="password" name="password" required minlength="6" autocomplete="new-password"></div>
    <div class="error"></div>
    <button class="btn block">Create admin account</button>
  </form></div>`;
  const f = $('form');
  f.onsubmit = async e => {
    e.preventDefault();
    const btn = $('button', f), err = $('.error', f);
    const username = cleanUsername(f.username.value), name = f.name.value.trim();
    if (!USERNAME_RE.test(username)) return err.textContent = 'Username: 3–30 letters/numbers (no spaces)';
    btn.disabled = true; err.textContent = '';
    try {
      const email = newStaffEmail(username);
      const { user } = await auth.createUserWithEmailAndPassword(email, f.password.value);
      await db.ref().update({
        ['staff/' + user.uid]: { username, name, role: 'admin', active: true, createdAt: TS() },
        ['usernames/' + username]: { uid: user.uid, email },
        'meta/setupDone': true,
      });
      await seedIfEmpty();
      settings = await loadSettings();
      toast('Admin account created');
      start(await currentStaff(['admin']));
    } catch (ex) { err.textContent = friendly(ex); btn.disabled = false; }
  };
}

function start(staff) {
  me = staff;
  CURRENCY = settings.currency;
  $('#app').innerHTML = `
    <div class="topbar"><span class="name"><img class="brandlogo" src="img/icon-64.png" alt="" width="30" height="30"> <span id="brand">${esc(settings.cafeName)} · Admin</span></span><span class="spacer"></span>
      <span class="small" style="opacity:.8">${ic('user', 15)} ${esc(me.name)}</span>
      <button class="btn ghost sm" id="sound">${ic('bell', 15)}Sound</button>
      <button class="btn ghost sm" onclick="logout()">Log out</button></div>
    <div class="layout"><nav class="side" id="side"></nav><div class="content" id="content"></div></div>`;
  $('#side').onclick = e => { const b = e.target.closest('button'); if (b) { view = b.dataset.v; show(); } };
  $('#sound').onclick = async () => {
    unlockAudio(); ding();
    if ('Notification' in window) { const p = await Notification.requestPermission(); toast(p === 'granted' ? 'Sound and pop-ups are on for new online orders' : 'Sound is on for new online orders'); }
  };
  show();
  listenOnline();
}

// ---------- Online orders (live, with sound) ----------
let onlineOrders = [], onlineSeen = null, onlineTab = 'new';
const onlineNew = () => onlineOrders.filter(o => o.status === 'new').length;
function listenOnline() {
  db.ref('orders').orderByChild('createdAt').startAt(Date.now() - 3 * 86400e3).on('value', snap => {
    const list = [];
    snap.forEach(c => { const v = c.val(); if (validOrder(v) && v.source === 'online') list.push(normOrder({ id: c.key, ...v })); });
    if (onlineSeen) for (const o of list) if (!onlineSeen.has(o.id) && o.status === 'new') {
      ding(); toast(`New online order from ${o.customer?.name || 'a customer'}: ${money(o.total)}`, 'alert', 8000);
      if ('Notification' in window && Notification.permission === 'granted' && document.hidden) { try { new Notification('New online order', { body: `${o.customer?.name || ''}: ${money(o.total)}` }); } catch {} }
    }
    onlineSeen = new Set(list.map(o => o.id));
    onlineOrders = list.sort((a, b) => b.createdAt - a.createdAt);
    const b = $('#onlineBadge'); if (b) { b.textContent = onlineNew(); b.hidden = !onlineNew(); }
    document.title = (onlineNew() ? `(${onlineNew()}) ` : '') + 'Admin Panel';
    if (view === 'online') drawOnline();
  }, () => {});
}
const waNumber = p => { const d = waStart(p); return d.length === 10 && d.startsWith('9') ? '977' + d : d; };
async function onlinePage() { drawOnline(); }
function drawOnline() {
  const groups = { new: ['new'], active: ['processing', 'ready'], done: ['delivered', 'cancelled'] };
  const list = onlineOrders.filter(o => groups[onlineTab].includes(o.status));
  if (onlineTab !== 'done') list.reverse(); // oldest first while working
  const n = k => onlineOrders.filter(o => groups[k].includes(o.status)).length;
  const stLabel = o => ({ new: 'new', processing: 'preparing', ready: o.orderType === 'pickup' ? 'ready' : 'on the way', delivered: o.orderType === 'pickup' ? 'picked up' : 'delivered', cancelled: 'cancelled' }[o.status]);
  const pill = o => ({ new: 'new', processing: 'processing', ready: 'processing', delivered: 'delivered', cancelled: 'cancelled' }[o.status]);
  C().innerHTML = `
    <div class="head"><div><h2>Online orders</h2><div class="muted">From your online shop website. New orders play a sound${'Notification' in window && Notification.permission !== 'granted' ? ' (tap <b>Sound</b> at the top once)' : ''}.</div></div></div>
    ${!onlineOrders.length && !settings._shopChecked ? '' : ''}
    <div class="otabs">${[['new', 'New'], ['active', 'In progress'], ['done', 'Done (3 days)']].map(([k, l]) => `<button data-t="${k}" class="${onlineTab === k ? 'on' : ''}">${l}${n(k) && k !== 'done' ? `<span class="count">${n(k)}</span>` : ''}</button>`).join('')}</div>
    <div class="ogrid">${list.map(o => {
      const c = o.customer || {}, pay = o.payment || {};
      const tel = String(c.phone || '').replace(/[^0-9+]/g, '');
      const wa = `https://wa.me/${waNumber(c.phone)}?text=${encodeURIComponent(`Hi ${c.name || ''}, this is ${settings.cafeName} about your order ${o.code}. `)}`;
      return `<div class="card ocard ${esc(o.status)}" data-id="${esc(o.id)}">
        <div class="ohead"><div><b class="oname">${esc(c.name || 'Customer')}</b><div class="small muted">Order ${esc(o.code)}, ${timeAgo(o.createdAt)}</div></div><span class="pill ${pill(o)}">${esc(stLabel(o))}</span></div>
        <div class="otype">${o.orderType === 'pickup' ? `${ic('store', 16)} Pickup at the cafe${c.address ? `<div class="small muted" style="font-weight:400">Address: ${esc(c.address)}</div>` : ''}` : `${ic('truck', 16)} Delivery: ${esc(c.address || '')}`}</div>
        <div class="ocontact"><a class="btn ghost sm" href="tel:${esc(tel)}">${ic('call', 14)}${esc(c.phone || '')}</a><a class="btn ghost sm" href="${esc(wa)}" target="_blank" rel="noopener">${ic('message', 14)}WhatsApp</a></div>
        <ul>${o.items.map(l => `<li><span><b>${l.qty}x</b> ${esc(l.name)}</span><span class="muted">${money(l.price * l.qty)}</span></li>`).join('')}
          ${o.orderType === 'delivery' ? `<li><span class="muted">Delivery</span><span class="muted">${o.deliveryFee ? money(o.deliveryFee) : 'Free'}</span></li>` : ''}</ul>
        ${o.note ? `<div class="note">${ic('note', 15)} ${esc(o.note)}</div>` : ''}
        <div class="ototal"><span>Total</span><span>${money(o.total)}</span></div>
        <div class="opay ${pay.method === 'online' ? (pay.verified ? 'ok' : 'warn2') : ''}">
          ${pay.method === 'online'
            ? `${ic('phone', 15)} Paid online${pay.ref ? `, transaction ID <b>${esc(pay.ref)}</b>` : ''}. ${pay.verified ? '<b>Payment received</b>' : `Check your ${esc((settings._wallet) || 'wallet')} app.`}`
            : `${ic('cash', 15)} ${o.orderType === 'pickup' ? 'Pay at pickup' : 'Cash on delivery'}`}
          ${pay.method === 'online' && !pay.verified ? `<button class="btn green sm" data-pay="1">${ic('check', 14)}Payment received</button>` : ''}
        </div>
        <div class="oacts">
          ${o.status === 'new' ? `<button class="btn amber" data-s="processing">${ic('flame', 16)}Accept and start preparing</button><button class="btn danger sm" data-s="cancelled">Cancel</button>` : ''}
          ${o.status === 'processing' ? `<button class="btn" data-s="ready">${o.orderType === 'pickup' ? ic('check', 16) + 'Ready for pickup' : ic('truck', 16) + 'Out for delivery'}</button><button class="btn ghost sm" data-s="new">Undo</button>` : ''}
          ${o.status === 'ready' ? `<button class="btn green" data-s="delivered">${ic('check', 16)}${o.orderType === 'pickup' ? 'Picked up' : 'Delivered'}</button><button class="btn ghost sm" data-s="processing">Undo</button>` : ''}
          ${o.status === 'delivered' || o.status === 'cancelled' ? `<button class="btn ghost sm" data-s="processing">Reopen</button>` : ''}
        </div>
      </div>`;
    }).join('') || `<div class="empty">${onlineTab === 'new' ? `<div style="margin-bottom:8px">${ic('bag', 34)}</div>No new online orders. They'll appear here with a sound.` : 'Nothing here.'}</div>`}</div>`;
  C().querySelector('.otabs').onclick = e => { const b = e.target.closest('button'); if (b) { onlineTab = b.dataset.t; drawOnline(); } };
  C().querySelector('.ogrid').onclick = async e => {
    const b = e.target.closest('button[data-s],button[data-pay]'); if (!b) return;
    const id = b.closest('[data-id]').dataset.id;
    if (b.dataset.s === 'cancelled' && !confirm('Cancel this order? Let the customer know on WhatsApp or by phone.')) return;
    b.disabled = true;
    try {
      if (b.dataset.pay) await db.ref('orders/' + id).update({ 'payment/verified': true, handledBy: me.name, updatedAt: TS() });
      else await db.ref('orders/' + id).update({ status: b.dataset.s, handledBy: me.name, updatedAt: TS() });
    } catch (err) { toast(friendly(err), 'alert'); b.disabled = false; }
  };
}

// ---------- Online shop settings ----------
async function compressQr(file) {
  const url = URL.createObjectURL(file);
  try {
    const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = () => rej(new Error('Could not read that image. Please use a JPG or PNG.')); i.src = url; });
    const scale = Math.min(1, 800 / Math.max(img.naturalWidth, img.naturalHeight));
    const c = document.createElement('canvas'); c.width = Math.round(img.naturalWidth * scale); c.height = Math.round(img.naturalHeight * scale);
    const ctx = c.getContext('2d'); ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, c.width, c.height); ctx.drawImage(img, 0, 0, c.width, c.height);
    let q = 0.92, data = c.toDataURL('image/jpeg', q);
    while (data.length > 380000 && q > 0.5) { q -= 0.1; data = c.toDataURL('image/jpeg', q); }
    return data;
  } finally { URL.revokeObjectURL(url); }
}
async function shopPage() {
  const sh = (await db.ref('online').once('value')).val() || {};
  const qrData = sh.payQr ? (await db.ref('payqr').once('value')).val() : null;
  const tog = (name, label, on, hint = '') => `<label class="tog"><span><b>${label}</b>${hint ? `<small class="muted">${hint}</small>` : ''}</span><span class="switch"><input type="checkbox" name="${name}" ${on ? 'checked' : ''}><span></span></span></label>`;
  C().innerHTML = `
    <div class="head"><div><h2>Online shop</h2><div class="muted">Settings for your online ordering website (the <b>cloud-kitchen-online</b> site).</div></div></div>
    <form class="card panel" id="shopf" style="max-width:640px">
      <h3>Ordering</h3>
      ${tog('enabled', 'Accept online orders', sh.enabled, 'Turn off to pause ordering. Customers can still see the menu.')}
      ${tog('allowDelivery', 'Delivery', sh.allowDelivery !== false)}
      <div class="field" style="max-width:220px;margin-left:2px"><label>Delivery fee (${esc(CURRENCY)})</label><input type="number" name="deliveryFee" min="0" step="any" value="${Number(sh.deliveryFee) || 0}"></div>
      ${tog('allowPickup', 'Pickup at the cafe', sh.allowPickup !== false)}
      <h3 style="margin-top:22px">Payment</h3>
      ${tog('cod', 'Cash on delivery / pay at pickup', sh.cod !== false)}
      ${tog('payOnline', 'Pay online', !!sh.payOnline, 'Customers see your payment QR and wallet details at checkout.')}
      <div class="row2">
        <div class="field"><label>Wallet or bank</label><input type="text" name="walletName" maxlength="40" value="${esc(sh.walletName || '')}" placeholder="e.g. eSewa, Khalti, Fonepay"></div>
        <div class="field"><label>Wallet / account number</label><input type="text" name="walletNumber" maxlength="40" value="${esc(sh.walletNumber || '')}" placeholder="e.g. 98XXXXXXXX"></div>
      </div>
      <div class="field"><label>Account name</label><input type="text" name="accountName" maxlength="60" value="${esc(sh.accountName || '')}" placeholder="Name shown in the payment app"></div>
      <div class="field"><label>Payment QR code</label>
        <div class="photo-pick">
          <div class="photo-box" id="qrbox" style="width:120px;height:120px;background:#fff">${qrData ? `<img src="${qrData}" alt="" style="object-fit:contain">` : ic('qr', 40)}</div>
          <div class="photo-btns">
            <label class="btn ghost sm" style="margin:0;color:var(--ink);font-weight:600">${ic('camera', 15)}Upload QR image<input type="file" name="qrfile" accept="image/*" hidden></label>
            <button type="button" class="btn danger sm" id="qrremove" ${qrData ? '' : 'hidden'}>Remove QR</button>
            <div class="small muted">A screenshot of your eSewa / Khalti / bank QR works.</div>
          </div>
        </div></div>
      <h3 style="margin-top:22px">Automatic WhatsApp alerts</h3>
      <p class="small muted" style="margin:-6px 0 12px">Every online order is also sent to your WhatsApp automatically, using the free CallMeBot service. Set it up once:</p>

// ---------- Sales report ----------
const monthStart = d => new Date(d.getFullYear(), d.getMonth(), 1).getTime();
const pad2 = n => String(n).padStart(2, '0');
const dayKey = t => { const d = new Date(t); return `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`; };
let salesMonth = null, salesRows = [];

async function sales() {
  const now = new Date();
  salesMonth = salesMonth || `${now.getFullYear()}-${pad2(now.getMonth() + 1)}`;
  C().innerHTML = `
    <div class="head"><div><h2>Sales report</h2><div class="muted">Sales count orders marked <b>delivered</b>. Times are this device's local time.</div></div>
      <span class="spacer"></span>
      <input type="month" id="mon" value="${salesMonth}" max="${now.getFullYear()}-${pad2(now.getMonth() + 1)}" style="max-width:170px">
      <button class="btn ghost" id="csv">${ic('download', 16)}Download (Excel)</button></div>
    <div id="rep"><div class="muted">Loading…</div></div>`;
  $('#mon').onchange = e => { if (e.target.value) { salesMonth = e.target.value; drawSales(); } };
  $('#csv').onclick = downloadCsv;
  await drawSales();
}

async function drawSales() {
  const [y, m] = salesMonth.split('-').map(Number);
  const start = new Date(y, m - 1, 1).getTime(), end = new Date(y, m, 1).getTime() - 1;
  const snap = await db.ref('orders').orderByChild('createdAt').startAt(start).endAt(end).once('value');
  const all = [];
  snap.forEach(c => { const v = c.val(); if (validOrder(v)) all.push(normOrder({ id: c.key, ...v })); });
  const done = all.filter(o => o.status === 'delivered');
  const total = done.reduce((s, o) => s + o.total, 0);
  const cancelled = all.filter(o => o.status === 'cancelled').length;
  const open = all.filter(o => o.status === 'new' || o.status === 'processing').length;
  const qrSales = done.filter(o => o.source === 'qr').reduce((s, o) => s + o.total, 0);
  const onlineSales = done.filter(o => o.source === 'online').reduce((s, o) => s + o.total, 0);

  // day by day
  const daysInMonth = new Date(y, m, 0).getDate();
  const now = new Date(), isThisMonth = now.getFullYear() === y && now.getMonth() === m - 1;
  const lastDay = isThisMonth ? now.getDate() : daysInMonth;
  const byDay = {};
  for (let d = 1; d <= lastDay; d++) byDay[`${y}-${pad2(m)}-${pad2(d)}`] = { sales: 0, orders: 0 };
  done.forEach(o => { const k = dayKey(o.createdAt); if (byDay[k]) { byDay[k].sales += o.total; byDay[k].orders++; } });
  salesRows = Object.entries(byDay).map(([day, v]) => ({ day, ...v }));
  const best = salesRows.reduce((b, r) => (r.sales > (b ? b.sales : 0) ? r : b), null);
  const maxSale = Math.max(1, ...salesRows.map(r => r.sales));
  const todayRow = isThisMonth ? byDay[dayKey(Date.now())] : null;

  // best sellers
  const items = {};
  done.forEach(o => o.items.forEach(l => { const it = items[l.name] || (items[l.name] = { qty: 0, sales: 0 }); it.qty += l.qty; it.sales += l.qty * l.price; }));
  const topItems = Object.entries(items).sort((a, b) => b[1].sales - a[1].sales).slice(0, 10);
  const fmtDay = k => new Date(k + 'T00:00').toLocaleDateString(undefined, { weekday: 'short', day: 'numeric', month: 'short' });
  const monthName = new Date(y, m - 1, 1).toLocaleDateString(undefined, { month: 'long', year: 'numeric' });

  $('#rep').innerHTML = `
    <div class="stats">
      ${todayRow ? `<div class="card stat"><div class="muted small">Today</div><div class="v">${money(todayRow.sales)}</div><div class="small muted">${todayRow.orders} orders delivered</div></div>` : ''}
      <div class="card stat"><div class="muted small">${esc(monthName)}</div><div class="v">${money(total)}</div><div class="small muted">${done.length} orders delivered</div></div>
      <div class="card stat"><div class="muted small">Average per day</div><div class="v">${money(Math.round(total / Math.max(1, lastDay)))}</div><div class="small muted">over ${lastDay} day${lastDay > 1 ? 's' : ''}</div></div>
      <div class="card stat"><div class="muted small">Best day</div><div class="v" style="font-size:20px">${best ? esc(fmtDay(best.day)) : '—'}</div><div class="small muted">${best ? money(best.sales) : 'no sales yet'}</div></div>
    </div>
    <div class="small muted" style="margin:-10px 0 20px">QR orders: <b>${money(qrSales)}</b> · Offline orders: <b>${money(total - qrSales - onlineSales)}</b> · Online orders: <b>${money(onlineSales)}</b>${open ? ` · ${open} order${open > 1 ? 's' : ''} still open (not counted yet)` : ''}${cancelled ? ` · ${cancelled} cancelled` : ''}</div>
    <div class="salesgrid">
      <div>
        <h3 style="margin:0 0 10px">Day by day</h3>
        <div class="tablewrap"><table>
          <tr><th>Day</th><th>Orders</th><th style="width:45%">Sales</th></tr>
          ${salesRows.slice().reverse().map(r => `<tr${r === best ? ' style="background:#fdf6ee"' : ''}>
            <td>${esc(fmtDay(r.day))}</td><td>${r.orders}</td>
            <td><div class="barrow">${r.sales ? `<div class="bar" style="width:${(r.sales / maxSale * 60).toFixed(1)}%"></div>` : ''}<b${r.sales ? '' : ' class="muted"'}>${money(r.sales)}</b></div></td></tr>`).join('')}
          <tr style="font-weight:800;background:#fcf9f6"><td>Total</td><td>${done.length}</td><td>${money(total)}</td></tr>
        </table></div>
      </div>
      <div>
        <h3 style="margin:0 0 10px">Best sellers</h3>
        <div class="tablewrap"><table>
          <tr><th>Item</th><th>Qty</th><th>Sales</th></tr>
          ${topItems.map(([n, v]) => `<tr><td>${esc(n)}</td><td>${v.qty}</td><td>${money(v.sales)}</td></tr>`).join('') || `<tr><td colspan="3" class="muted" style="text-align:center;padding:20px">No sales yet</td></tr>`}
        </table></div>
      </div>
    </div>`;
}

function downloadCsv() {
  const lines = [['Date', 'Orders delivered', 'Sales (' + CURRENCY + ')'], ...salesRows.map(r => [r.day, r.orders, r.sales]),
    ['Total', salesRows.reduce((s, r) => s + r.orders, 0), salesRows.reduce((s, r) => s + r.sales, 0)]];
  const csv = lines.map(r => r.map(v => `"${String(v).replace(/"/g, '""')}"`).join(',')).join('\r\n');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob(['\ufeff' + csv], { type: 'text/csv' }));
  a.download = `sales-${salesMonth}.csv`; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

      else up['menu/' + id] = { ...row, image: '', available: true, createdAt: TS() };
      if (newPhoto) { up['photos/' + id] = newPhoto; up['menu/' + id + '/photo'] = Date.now(); if (it) up['menu/' + id + '/image'] = ''; }
      if (removePhoto && it) { up['photos/' + id] = null; up['menu/' + id + '/photo'] = null; up['menu/' + id + '/image'] = ''; }
      if (!it && newPhoto) { up['menu/' + id].photo = up['menu/' + id + '/photo']; delete up['menu/' + id + '/photo']; }
      try {
        await db.ref().update(up);
        close(); toast(it ? 'Saved' : 'Item added'); menu();
      } catch (err) { $('.error', f).textContent = friendly(err); btn.disabled = false; }
    };
  });
}

// ---------- Staff (waiter accounts) ----------
// A second Firebase connection is used to create logins, so the admin stays logged in
let signupApp = null;
async function createLogin(username, password) {
  signupApp = signupApp || firebase.initializeApp(FB, 'signup');
  const email = newStaffEmail(username);
  const { user } = await signupApp.auth().createUserWithEmailAndPassword(email, password);
  const uid = user.uid;
  await signupApp.auth().signOut();
  return { uid, email };
}

async function staffPage() {
  const list = listOf((await db.ref('staff').once('value')).val()).map(s => ({ ...s, uid: s.id }))
    .sort((a, b) => a.role.localeCompare(b.role) || a.name.localeCompare(b.name));
  C().innerHTML = `
    <div class="head"><div><h2>Waiter accounts</h2><div class="muted">Waiters log in on the waiter panel website with this username and password.</div></div>
      <span class="spacer"></span><button class="btn" id="add">+ Create waiter login</button></div>
    <div class="tablewrap"><table>
      <tr><th>Name</th><th>Username</th><th>Role</th><th>Active</th><th></th></tr>
      ${list.map(w => `<tr data-id="${esc(w.uid)}">
        <td><b>${esc(w.name)}</b>${w.uid === me.uid ? ' <span class="small muted">(you)</span>' : ''}</td><td>${esc(w.username)}</td>
        <td><span class="pill ${w.role === 'admin' ? 'new' : 'delivered'}">${esc(w.role)}</span></td>
        <td>${w.uid === me.uid ? '' : `<label class="switch"><input type="checkbox" data-a="toggle" ${w.active ? 'checked' : ''}><span></span></label>`}</td>
        <td style="white-space:nowrap;text-align:right">${w.uid === me.uid ? '' : `<button class="btn ghost sm" data-a="pw">Reset password</button><button class="btn danger sm" data-a="del">Delete</button>`}</td>
      </tr>`).join('')}
    </table></div>`;
  $('#add').onclick = () => openModal(`
    <h2>Create waiter login</h2>
    <form autocomplete="off">
      <div class="field"><label>Full name</label><input type="text" name="name" required maxlength="60" placeholder="e.g. Ramesh"></div>
      <div class="field"><label>Username (ID)</label><input type="text" name="username" required autocapitalize="none" placeholder="e.g. ramesh"></div>
      <div class="field"><label>Password (min 6 characters)</label><input type="text" name="password" required minlength="6"></div>
      <div class="field"><label>Role</label><select name="role"><option value="waiter">Waiter</option><option value="admin">Admin (full access)</option></select></div>
      <div class="error"></div>
      <div class="actions"><button type="button" class="btn ghost" data-close>Cancel</button><button class="btn" type="submit">Create</button></div>
    </form>`, (m, close) => {
    const f = $('form', m); $('[data-close]', m).onclick = close; f.name.focus();
    f.onsubmit = async e => {
      e.preventDefault();
      const btn = $('button[type=submit]', f), err = $('.error', f);
      const username = cleanUsername(f.username.value);
      if (!USERNAME_RE.test(username)) return err.textContent = 'Username: 3–30 letters/numbers (no spaces)';
      btn.disabled = true; err.textContent = '';
      try {
        if ((await db.ref('usernames/' + username).once('value')).exists()) throw new Error('That username is already taken');
        const { uid, email } = await createLogin(username, f.password.value);
        await db.ref().update({
          ['staff/' + uid]: { username, name: f.name.value.trim(), role: f.role.value, active: true, createdAt: TS() },
          ['usernames/' + username]: { uid, email },
        });
        close(); toast(`Login created: ${username}`); staffPage();
      } catch (ex) { err.textContent = friendly(ex); btn.disabled = false; }
    };
  });
  C().onclick = async e => {
    const el = e.target.closest('button[data-a]'); if (!el) return;
    const w = list.find(x => x.uid === el.closest('[data-id]').dataset.id);
    try {
      if (el.dataset.a === 'del' && confirm(`Delete "${w.name}"? Their login will stop working.`)) {
        await db.ref().update({ ['staff/' + w.uid]: null, ['usernames/' + w.username]: null });
        toast('Deleted'); staffPage();
      }
      if (el.dataset.a === 'pw') {
        const pw = prompt(`New password for ${w.username} (min 6 characters):`);
        if (!pw) return;
        if (pw.length < 6) return toast('Password must be at least 6 characters', 'alert');
        // Firebase doesn't let a website change someone else's password, so we make a fresh login
        // with the same username and new password, and retire the old one.
        const { uid, email } = await createLogin(w.username, pw);
        await db.ref().update({
          ['staff/' + uid]: { username: w.username, name: w.name, role: w.role, active: w.active !== false, createdAt: TS() },
          ['staff/' + w.uid]: null,
          ['usernames/' + w.username]: { uid, email },
        });
        toast('Password changed'); staffPage();
      }
    } catch (err) { toast(friendly(err), 'alert'); }
  };
  C().onchange = async e => {
    if (e.target.dataset.a !== 'toggle') return;
    try {
      await db.ref('staff/' + e.target.closest('[data-id]').dataset.id).update({ active: e.target.checked });
      toast(e.target.checked ? 'Account enabled' : 'Account disabled: they can no longer see orders');
    } catch (err) { toast(friendly(err), 'alert'); e.target.checked = !e.target.checked; }
  };
}

// ---------- Tables & QR ----------
function menuLink(t) {
  const base = (settings.customerUrl || '').trim();
  if (!base) return '';
  const sep = /\.html?$/i.test(base) || base.endsWith('/') ? '' : '/';
  return `${base}${sep}?table=${encodeURIComponent(t)}`;
}
function qrDataUrl(text) { const qr = qrcode(0, 'M'); qr.addData(text); qr.make(); return qr.createDataURL(8, 2); }

async function tables() {
  const list = listOf((await db.ref('tables').once('value')).val()).sort((a, b) => (a.sort || 0) - (b.sort || 0));
  const ok = !!settings.customerUrl;
  C().innerHTML = `
    <div class="head"><div><h2>Tables & QR codes</h2><div class="muted">Print and stick one QR code on each table.</div></div>
      <span class="spacer"></span><button class="btn ghost" id="edit">Edit tables</button>${ok ? `<button class="btn" onclick="print()">${ic('printer', 16)}Print all</button>` : ''}</div>
    ${ok ? '' : `<div class="warn noprint">${ic('alert', 16)} First set your <b>customer menu website address</b> in <b>Settings</b>. The QR codes need it.</div>`}
    <div class="qrgrid">${list.map(t => {
      const url = menuLink(t.id);
      return `<div class="card qrcard">
        <div class="small muted">${esc(settings.cafeName)}</div>
        <div class="t">${esc(place(t.id))}</div>
        ${url ? `<img src="${qrDataUrl(url)}" alt="QR for ${esc(t.id)}">
        <div class="small"><b>Scan to see the menu & order</b></div>
        <div class="u noprint">${esc(url)}</div>
        <div class="noprint" style="margin-top:8px"><a class="btn ghost sm" style="text-decoration:none" href="${qrDataUrl(url)}" download="qr-${esc(t.id)}.gif">Download</a>
          <a class="btn ghost sm" style="text-decoration:none" href="${esc(url)}" target="_blank" rel="noopener">${ic('external', 13)}Open</a></div>` : `<div class="muted small" style="padding:30px 0">QR appears after you set the website address</div>`}
      </div>`;
    }).join('')}</div>`;
  $('#edit').onclick = () => openModal(`
    <h2>Edit tables</h2>
    <form>
      <div class="field"><label>Quick set: number of tables</label>
        <div style="display:flex;gap:8px"><input type="number" name="n" min="1" max="200" placeholder="e.g. 12"><button type="button" class="btn ghost" id="fill">Fill 1…N</button></div></div>
      <div class="field"><label>Table names (one per line: numbers or names like "Rooftop 1")</label>
        <textarea name="list" rows="10">${esc(list.map(t => t.id).join('\n'))}</textarea></div>
      <div class="error"></div>
      <div class="actions"><button type="button" class="btn ghost" data-close>Cancel</button><button class="btn" type="submit">Save tables</button></div>
    </form>`, (m, close) => {
    const f = $('form', m); $('[data-close]', m).onclick = close;
    $('#fill', m).onclick = () => { const n = +f.n.value; if (n > 0) f.list.value = Array.from({ length: Math.min(n, 200) }, (_, i) => i + 1).join('\n'); };
    f.onsubmit = async e => {
      e.preventDefault();
      const err = $('.error', f);
      const names = [...new Set(f.list.value.split('\n').map(s => s.trim()).filter(Boolean))];
      const bad = names.find(n => n.length > 20 || /[.#$\[\]\/]/.test(n));
      if (bad) return err.textContent = `"${bad}": max 20 characters, and no . # $ [ ] /`;
      if (!names.length) return err.textContent = 'Add at least one table';
      try {
        const up = {};
        list.filter(t => !names.includes(t.id)).forEach(t => up['tables/' + t.id] = null);
        names.forEach((n, i) => up['tables/' + n + '/sort'] = i + 1);
        await db.ref().update(up);
        close(); toast('Tables saved'); tables();
      } catch (ex) { err.textContent = friendly(ex); }
    };
  });
}

// ---------- Settings ----------
async function settingsPage() {
  settings = await loadSettings();
  C().innerHTML = `
    <div class="head"><h2>Settings</h2></div>
    <form class="card panel" id="s1">
      <h3>Cafe details</h3>
      <div class="field"><label>Cafe name</label><input type="text" name="cafeName" value="${esc(settings.cafeName)}" required maxlength="60"></div>
      <div class="field"><label>Tagline (shown on menu)</label><input type="text" name="tagline" value="${esc(settings.tagline || '')}" maxlength="100"></div>
      <div class="field"><label>Currency symbol</label><input type="text" name="currency" value="${esc(settings.currency)}" maxlength="8" style="max-width:120px"></div>
      <div class="field"><label>Customer menu website address (used in QR codes)</label>
        <input type="url" name="customerUrl" value="${esc(settings.customerUrl || '')}" maxlength="300" placeholder="e.g. https://yourname.github.io/ck-menu/">
        <div class="small muted" style="margin-top:4px">The address where you put the <b>customer</b> site.</div></div>
      <button class="btn">Save</button>
    </form>
    <form class="card panel" id="s2">
      <h3>Change my password</h3>
      <div class="small muted" style="margin-bottom:12px">Logged in as <b>${esc(me.username)}</b></div>
      <div class="field"><label>Current password</label><input type="password" name="cur" required autocomplete="current-password"></div>
      <div class="field"><label>New password (min 6 characters)</label><input type="password" name="pw" required minlength="6" autocomplete="new-password"></div>
      <div class="field"><label>Repeat new password</label><input type="password" name="pw2" required minlength="6" autocomplete="new-password"></div>
      <div class="error"></div>
      <button class="btn">Change password</button>
    </form>`;
  $('#s1').onsubmit = async e => {
    e.preventDefault(); const f = e.target;
    const row = { cafeName: f.cafeName.value.trim() || 'Cloud Kitchen', tagline: f.tagline.value.trim(), currency: f.currency.value.trim() || 'Rs.', customerUrl: f.customerUrl.value.trim() };
    try {
      await db.ref('settings').set(row);
      Object.assign(settings, row); CURRENCY = settings.currency;
      $('#brand').textContent = settings.cafeName + ' · Admin'; toast('Settings saved');
    } catch (err) { toast(friendly(err), 'alert'); }
  };
  $('#s2').onsubmit = async e => {
    e.preventDefault(); const f = e.target, err = $('.error', f);
    if (f.pw.value !== f.pw2.value) return err.textContent = 'New passwords do not match';
    try {
      const user = auth.currentUser;
      await user.reauthenticateWithCredential(firebase.auth.EmailAuthProvider.credential(user.email, f.cur.value));
      await user.updatePassword(f.pw.value);
      f.reset(); err.textContent = ''; toast('Password changed');
    } catch (ex) { err.textContent = /invalid-credential|wrong-password/.test(ex.code || '') ? 'Current password is wrong' : friendly(ex); }
  };
}
</script>
